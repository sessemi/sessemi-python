# open sessemi
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessemi"
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]
description = "Sessemi — web scraping API that solves DataDome, Cloudflare, and Akamai."
readme = "README.md"
license = {text = "MIT"}
keywords = ["scraping", "web-scraping", "datadome", "cloudflare", "akamai", "anti-bot", "captcha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://sessemi.com"
Documentation = "https://sessemi.com/docs"
Repository = "https://github.com/sessemi/sessemi-python"
Issues = "https://github.com/sessemi/sessemi-python/issues"

[project.scripts]
sessemi = "sessemi.cli:main"

[project.optional-dependencies]
dev = ["python-dotenv"]

[tool.setuptools.dynamic]
version = {attr = "sessemi.__version__"}

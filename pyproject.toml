# open sessemi
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessemi"
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["python-dotenv"]

[tool.setuptools.dynamic]
version = {attr = "sessemi.__version__"}

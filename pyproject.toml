# open sessemi
[build-system]
requires = ["setuptools>=68.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sessemi"
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]
description = "Sessemi — web scraping API that solves DataDome, Cloudflare, and Akamai."
readme = "README.md"
license = {text = "MIT"}
keywords = ["scraping", "web-scraping", "datadome", "cloudflare", "akamai", "anti-bot", "captcha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://sessemi.com"
Documentation = "https://sessemi.com/docs"
Repository = "https://github.com/sessemi/sessemi-python"
Issues = "https://github.com/sessemi/sessemi-python/issues"

[project.scripts]
sessemi = "sessemi.cli:main"

[project.optional-dependencies]
dev = ["python-dotenv"]

[tool.setuptools_scm]
# Version is derived from the most recent `v*` git tag.
# Between tags, setuptools_scm produces e.g. 1.3.0.post3+gabc123d.
# fallback_version is used if the package is built outside a git work tree
# (e.g. from a tarball without .git history).
fallback_version = "0.0.0+unknown"
